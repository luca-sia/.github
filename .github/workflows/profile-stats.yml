name: Profile stats

# Refreshes the "Last 30 days" block once a day on a GitHub hosted runner.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Count the last 30 days
        env:
          # Read only token that can see the private repos. Without it the last numbers stay.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_QUERIES: |
            org:luca-sia
          LANGUAGE_OWNERS: luca-sia
          EXCLUDE_REPOS: luca-sia/aigi,luca-sia/aigi-wp-theme
          USAGE_URL: ${{ secrets.USAGE_URL }}
          USAGE_TOKEN: ${{ secrets.USAGE_TOKEN }}
          USAGE_ACCESS_ID: ${{ secrets.USAGE_ACCESS_ID }}
          USAGE_ACCESS_SECRET: ${{ secrets.USAGE_ACCESS_SECRET }}
          README_PATH: profile/README.md
        run: node scripts/profile-stats.mjs
      - name: Commit when the numbers moved
        # Committed through the GitHub API by the Actions bot so GitHub signs it, as the org requires
        # signed commits. A custom author would drop the signature, so none is set.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          FILE=profile/README.md
          SHA=$(git rev-parse HEAD:$FILE)
          base64 -w0 "$FILE" > /tmp/readme.b64
          jq -n --rawfile content /tmp/readme.b64 --arg sha "$SHA" --arg branch "${GITHUB_REF_NAME}" \
            '{message: "Refresh profile stats", content: $content, sha: $sha, branch: $branch}' > /tmp/body.json
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$FILE" --input /tmp/body.json --jq .commit.html_url
