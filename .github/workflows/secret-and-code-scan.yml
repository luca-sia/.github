name: Secret and code scan

# Shared by the Lucasia repos (no GitHub add-on): gitleaks over the commits of the pull request or push, and
# Semgrep CE over the code. A secret, or a high Semgrep finding, fails the job. A repo calls it with
#
#   jobs:
#     scan:
#       uses: luca-sia/.github/.github/workflows/secret-and-code-scan.yml@<commit>
#
# Accepting a finding: a secret fixture goes in the repo's .gitleaksignore with a comment above it; a code
# finding gets a `# nosemgrep: <rule id>` comment with the reason. Semgrep needs pypi.org,
# files.pythonhosted.org and semgrep.dev reachable from the runner.
on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON for runs-on
        type: string
        default: '["self-hosted","lucasia-ci"]'

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: luca-sia/.github
          path: .scan-tools-src
          persist-credentials: false
      - name: Scan the commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          tools="$RUNNER_TEMP/scan-tools"
          .scan-tools-src/scan/install-scan-tools.sh "$tools" gitleaks
          if [ "$EVENT_NAME" = "pull_request" ]; then range="$PR_BASE..$PR_HEAD"
          elif [ -n "${BEFORE//0/}" ]; then range="$BEFORE..$SHA"
          else range="$SHA~1..$SHA"; fi
          # gitleaks reads an unresolvable range as no commits and exits 0, so the range is checked first.
          git rev-list --count "$range" >/dev/null
          # Every .gitleaksignore entry needs a comment above it.
          if [ -f .gitleaksignore ]; then
            awk 'BEGIN{c=0} /^[[:space:]]*$/{c=0;next} /^[[:space:]]*#/{c=1;next} !c{print "no comment above .gitleaksignore line " NR; bad=1} END{exit bad}' .gitleaksignore
          fi
          "$tools/bin/gitleaks" detect --no-banner --redact --log-opts "$range"

  code:
    name: code scan (semgrep)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: luca-sia/.github
          path: .scan-tools-src
          persist-credentials: false
      - name: Scan the code
        run: |
          tools="$RUNNER_TEMP/scan-tools"
          .scan-tools-src/scan/install-scan-tools.sh "$tools" semgrep
          report="$RUNNER_TEMP/semgrep.json"
          "$tools/bin/semgrep" scan --metrics=off --quiet --timeout 30 --exclude node_modules --exclude dist --exclude .scan-tools-src \
            --config p/default --config p/security-audit --config p/typescript --json --output "$report" .
          # A file or rule Semgrep could not scan is a gap, not a clean result.
          jq -e '[.errors[]? | select(.level == "error")] | length == 0' "$report" >/dev/null || { echo "::error::semgrep could not scan some files or rules"; exit 1; }
          high="$(jq '[.results[] | select(.extra.severity == "ERROR" and .extra.metadata.impact == "HIGH")] | length' "$report")"
          jq -r '.results[] | select(.extra.severity == "ERROR" and .extra.metadata.impact == "HIGH") | "::error file=\(.path),line=\(.start.line)::\(.check_id | split(".") | last)"' "$report"
          echo "semgrep: $(jq '.results | length' "$report") findings, $high high"
          [ "$high" = 0 ]
